# Secrets for scripts in this repository. Values live in your SecretSpec
# provider (`secretspec config global init`), never in git.
#
# Publish the web viewer (docs/WEB_VIEWER.md):
#   secretspec check
#   secretspec run -- deploy/web-viewer/publish.sh --config ~/.config/iroh-news/config.toml
[project]
name = "renews"
revision = "1.0"

[profiles.default]
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token that can deploy the viewer Worker", required = true }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account id that owns the viewer Worker", required = true }
